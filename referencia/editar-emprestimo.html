<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar Empréstimo - CobraFácil</title>
<style>
  :root{
    --bg:#0f1115;
    --surface:#1a1d24;
    --surface-2:#22262f;
    --border:#2b303b;
    --text:#e7e9ee;
    --muted:#8b93a3;
    --green:#22c55e;
    --green-soft:#14311f;
    --red:#ef4444;
    --input-bg:#161a21;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:24px 12px;
  }

  /* Overlay + Modal */
  .modal{
    width:100%;
    max-width:512px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:0 25px 60px rgba(0,0,0,.55);
    max-height:92vh;
    overflow-y:auto;
    position:relative;
    padding:20px;
  }
  @media(min-width:640px){ .modal{ padding:26px; } }

  .modal-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;
  }
  .modal-title{font-size:20px;font-weight:700}
  .close-btn{
    width:34px;height:34px;border:none;border-radius:8px;cursor:pointer;
    background:var(--red);color:#fff;font-size:18px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .close-btn:hover{filter:brightness(1.1)}

  form{display:flex;flex-direction:column;gap:16px}

  label.field-label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
  .req{color:var(--green)}
  .hint{font-size:11px;color:var(--muted);margin-top:4px}

  input, select, textarea, .fake-select{
    width:100%;
    background:var(--input-bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    color:var(--text);
    font-size:14px;
    padding:10px 12px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus{
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(34,197,94,.15);
  }
  input::placeholder, textarea::placeholder{color:#5b6272}
  textarea{resize:vertical;min-height:70px}
  select{appearance:none;cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%238b93a3' stroke-width='2' viewBox='0 0 24 24'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;padding-right:36px;
  }

  /* Client selector (custom searchable) */
  .client-select{
    display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  }
  .client-info{display:flex;align-items:center;gap:10px}
  .avatar{
    width:26px;height:26px;border-radius:50%;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);
  }
  .score-badge{
    background:#3a2f12;color:#f5c451;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700;
  }
  .chevron{color:var(--muted)}

  .client-dropdown{
    display:none;margin-top:8px;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--input-bg);overflow:hidden;
  }
  .client-dropdown.open{display:block}
  .client-search{border:none;border-bottom:1px solid var(--border);border-radius:0;background:transparent}
  .client-option{
    display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;font-size:14px;
  }
  .client-option:hover{background:var(--surface-2)}
  .client-option.muted{color:var(--muted)}
  .check{margin-left:auto;color:var(--green)}

  /* Two-column rows */
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  /* Total a Receber highlight */
  .total-box{
    background:var(--green-soft);
    border:1px solid rgba(34,197,94,.35);
    color:var(--green);
    font-weight:700;font-size:15px;
    border-radius:var(--radius);
    padding:12px;
  }

  /* Installment date rows */
  .parcela-row{display:flex;align-items:center;gap:12px}
  .parcela-row .lbl{font-size:13px;color:var(--muted);min-width:78px}

  /* Checkboxes */
  .checkbox-group{display:flex;flex-direction:column;gap:10px}
  .check-item{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
  .check-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);cursor:pointer}

  .btn{
    border:none;border-radius:var(--radius);padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;
    transition:filter .15s, background .15s;
  }
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn-outline:hover{background:var(--surface-2)}
  .btn-ghost{background:var(--surface-2);color:var(--text)}
  .btn-recalc{align-self:flex-start;background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
  .btn-primary{background:var(--green);color:#06240f}
  .btn-primary:hover{filter:brightness(1.08)}

  .section-title{font-size:13px;font-weight:600}
  .garantias-note{font-size:11px;color:var(--muted)}

  .actions{display:flex;gap:12px;margin-top:8px}
  .actions .btn{flex:1}

  hr.sep{border:none;border-top:1px solid var(--border);margin:2px 0}
</style>
</head>
<body>

<div class="modal" role="dialog" aria-labelledby="modalTitle">
  <div class="modal-header">
    <h2 class="modal-title" id="modalTitle">Editar Empréstimo</h2>
    <button type="button" class="close-btn" aria-label="Fechar" onclick="return false">&times;</button>
  </div>

  <form id="loanForm" onsubmit="return false">

    <!-- Cliente -->
    <div>
      <label class="field-label">Cliente <span class="req">*</span></label>
      <div class="fake-select client-select" onclick="toggleClientDropdown()">
        <div class="client-info">
          <span class="avatar">T</span>
          <span>TESTE1</span>
          <span class="score-badge">👍 100</span>
        </div>
        <span class="chevron">⇅</span>
      </div>
      <div class="client-dropdown" id="clientDropdown">
        <input class="client-search" type="text" placeholder="Buscar cliente...">
        <div class="client-option muted">＋ Digitar manualmente</div>
        <div class="client-option">
          <span class="avatar">T</span>
          <span>TESTE1</span>
          <span class="score-badge">👍 100</span>
          <span class="check">✓</span>
        </div>
      </div>
    </div>

    <!-- Valor / Juros -->
    <div class="row-2">
      <div>
        <label class="field-label">Valor (R$) <span class="req">*</span></label>
        <input type="number" id="valor" value="300" step="0.01">
      </div>
      <div>
        <label class="field-label">Juros (%)</label>
        <input type="number" id="juros" value="30" step="0.01">
      </div>
    </div>

    <!-- Tipo de Pagamento / Parcelas -->
    <div class="row-2">
      <div>
        <label class="field-label">Tipo de Pagamento</label>
        <select id="tipoPagamento">
          <option value="installment" selected>Parcelado (Mensal)</option>
          <option value="weekly">Semanal</option>
          <option value="biweekly">Quinzenal</option>
          <option value="daily">Diário</option>
        </select>
      </div>
      <div>
        <label class="field-label">Parcelas</label>
        <input type="number" id="parcelas" value="1" min="1">
      </div>
    </div>

    <!-- Juros Aplicado -->
    <div>
      <label class="field-label">Juros Aplicado</label>
      <select id="jurosAplicado">
        <option value="per_installment" selected>Por Parcela</option>
        <option value="on_total">Sobre o Total</option>
        <option value="compound">Juros Compostos</option>
        <option value="sac">SAC (Amort. Constante)</option>
        <option value="custom">Parcelas Personalizadas</option>
      </select>
    </div>

    <!-- Juros Total / Valor da Parcela -->
    <div class="row-2">
      <div>
        <label class="field-label">Juros Total (R$)</label>
        <input type="number" id="jurosTotal" placeholder="Ex: 160.00" step="0.01">
      </div>
      <div>
        <label class="field-label">Valor da Parcela (R$)</label>
        <input type="number" id="valorParcela" value="390.00" step="0.01">
      </div>
    </div>

    <!-- Total a Receber -->
    <div>
      <label class="field-label">Total a Receber</label>
      <div class="total-box" id="totalReceber">R$ 390,00</div>
    </div>

    <!-- Datas -->
    <div class="row-2">
      <div>
        <label class="field-label">Data do Contrato</label>
        <input type="date" id="dataContrato" value="2026-09-05">
        <div class="hint">Quando foi fechado</div>
      </div>
      <div>
        <label class="field-label">1ª Parcela <span class="req">*</span></label>
        <input type="date" id="primeiraParcela" value="2026-10-05">
        <div class="hint">Quando começa a pagar</div>
      </div>
    </div>

    <!-- Datas das Parcelas -->
    <div>
      <label class="field-label">Datas das Parcelas</label>
      <div class="parcela-row">
        <span class="lbl">Parcela 1:</span>
        <input type="date" value="2026-10-05">
      </div>
    </div>

    <!-- Dias que não cobra -->
    <div>
      <label class="field-label">Não cobra nos seguintes dias:</label>
      <div class="checkbox-group">
        <label class="check-item"><input type="checkbox"> Sábados</label>
        <label class="check-item"><input type="checkbox"> Domingos</label>
        <label class="check-item"><input type="checkbox"> Feriados</label>
      </div>
    </div>

    <button type="button" class="btn btn-recalc" onclick="recalcularDatas()">Recalcular Datas</button>

    <!-- Observações -->
    <div>
      <label class="field-label">Observações</label>
      <textarea id="observacoes" placeholder="Anotações sobre este empréstimo..."></textarea>
    </div>

    <!-- Garantias -->
    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <span class="section-title">Garantias (opcional)</span>
        <button type="button" class="btn btn-ghost" style="padding:6px 12px">＋ Adicionar</button>
      </div>
      <div class="garantias-note">Registre bens recebidos como garantia. Não afeta cálculos — apenas aparece no comprovante.</div>
    </div>

    <hr class="sep">

    <!-- Ações -->
    <div class="actions">
      <button type="button" class="btn btn-outline">Cancelar</button>
      <button type="submit" class="btn btn-primary">Salvar Alterações</button>
    </div>
  </form>
</div>

<script>
  function toggleClientDropdown(){
    document.getElementById('clientDropdown').classList.toggle('open');
  }

  // Recalcula o "Total a Receber" com base nos campos.
  // Ajuste esta lógica conforme as regras reais do seu sistema.
  function recalcularTotal(){
    const parcelas = parseFloat(document.getElementById('parcelas').value) || 0;
    const valorParcela = parseFloat(document.getElementById('valorParcela').value) || 0;
    const total = parcelas * valorParcela;
    document.getElementById('totalReceber').textContent =
      'R$ ' + total.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  ['parcelas','valorParcela'].forEach(id=>{
    document.getElementById(id).addEventListener('input', recalcularTotal);
  });

  function recalcularDatas(){
    // Placeholder: recalcular as datas das parcelas a partir da 1ª parcela
    // e do tipo de pagamento (mensal/semanal/quinzenal/diário).
    alert('Recalcular datas das parcelas (implemente a lógica conforme seu sistema).');
  }

  // Fecha o dropdown ao clicar fora
  document.addEventListener('click', function(e){
    const sel = document.querySelector('.client-select');
    const dd = document.getElementById('clientDropdown');
    if(!sel.contains(e.target) && !dd.contains(e.target)) dd.classList.remove('open');
  });
</script>
</body>
</html>
